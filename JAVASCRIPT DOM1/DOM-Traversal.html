<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <title>DOM Traversal</title>
    <style>
        body {
            margin: 50px;
            font-family: arial;
            background-color: #666;
        }
    
        .container {
            width: 900px;
            margin: auto;
        }
    
        .card {
            display: inline-block;
            width: 220px;
            padding: 0 80px;
            height: 80px;
            font-size: 16px;
            line-height: 80px;
            border-radius: 40px;
            background-color: #f1f1f1;
            margin: 20px;
            position: relative;
            text-align: center;
        }
    
        .card img {
            float: left;
            margin: 0 10px 0 -80px;
            height: 80px;
            width: 80px;
            border-radius: 50%;
            position: relative;
        }
    
        .card .nama,
        .card .telp {
            display: block;
            line-height: 20px;
            padding: 0 5px;
        }
    
        .card .nama {
            margin-left: 20px;
            margin-top: 20px;
            font-size: 20px;
        }
    
        .card .telp {
            margin-left: 20px;
            margin-top: 5px;
            font-size: 16px;
            color: #aaa;
        }
    
        .card .close {
            font-size: 24px;
            font-weight: bold;
            color: #999;
            position: absolute;
            top: 0;
            right: 30px;
            cursor: pointer;
        }
    
        .card a {
            text-decoration: none;
        }
    
        .card:hover .close {
            color: red;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    
    <body>
    
        <div class="container">
    
            <div class="card">
                <img src="img1/kwon1.png" width="96" height="96" alt="">
                <span class="nama">Kwon Yuli</span>
                <span class="telp">08123456789</span>
                <!-- <a href="" class="close">🏁</a> -->
                <span class="close">🏁</span>
            </div>
    
            <div class="card">
                <img src="img1/kwon yuli.png" width="96" height="96" alt="">
                <span class="nama">Kwon Yuli satu</span>
                <span class="telp">08123456789</span>
                <!-- <a href="" class="close">🏁</a> -->
                <span class="close">🏁</span>
            </div>
    
            <div class="card">
                <img src="img1/Kwon Y.png" width="96" height="96" alt="">
                <span class="nama">Kwon Yuli dua</span>
                <span class="telp">08123456789</span>
                <!-- <a href="" class="close">🏁</a> -->
                <span class="close">🏁</span>
            </div>
    
            <div class="card">
                <img src="img1/binar.png" width="96" height="96" alt="">
                <span class="nama">Binar</span>
                <span class="telp">08123456789</span>
                <!-- <a href="" class="close">🏁</a> -->
                <span class="close">🏁</span>
            </div>
    
        </div>
    
        <script src="DOM-Traversal.js"></script>
</body>
</html>
