        // VERSI CLASS (lebih rapih dan simple)

        class mahasiswa {
            constructor(nama, energi) {
                this.nama = nama;
                this.energi = energi;
            }

            makan(porsi) {
                this.energi += porsi;
                return `halo ${this.nama}, selamat makan`;
            }

            kerja(jam) {
                this.energi -= jam;
                return `halo ${this.nama}, selamat kerja`;
            }

            tidur(jam) {
                this.energi += jam * 2;
                return `halo ${this.nama}, selamat tidur`;
            }

        }
