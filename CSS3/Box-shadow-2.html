<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body {
            background-image: url(flower.png);
        }
        .satu {
            width: 300px;
            height: 300px;
            background-color: #39b54a;
            margin: 50px auto;
            box-shadow: 0px 30px 10px -20px rgba(0, 0, 0, .75);
            transition: .3s;
        }

        .satu:hover {
             box-shadow: 0px 80px 10px -40px rgba(0, 0, 0, .15);
             margin-top: 40px;
        }
        

        .dua {
            width: 300px;
            height: 300px;
            background-color: #39b54a;
            margin: 50px auto;
            box-shadow: 0px 0px 0px 5px red,
                0 0 0 10px green,
                0 0 0 15px yellow,
                0 0 0 20px orange;
            border-radius: 50%;
            
        }



    </style>
</head>
<body>
   <div class="satu"></div> 
   <br>
   <div class="dua"></div>
</body>
</html>
