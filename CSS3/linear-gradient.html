<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        div {
            width: 600px;
            height: 300px;
            margin: 50px auto;
        }

        .satu {
            background-image: linear-gradient(red,#f0d606,rgba(255,255,0,1),green);
        }

        .dua {
            background-image: linear-gradient(45deg,rgb(226, 241, 11),green);
        }

         .tiga {
            background-image: linear-gradient(-45deg,rgb(232, 237, 241),rgb(11, 30, 136));
        }

         .empat {
            background-image: linear-gradient(90deg,red,green);
        }
    </style>
</head>
<body>
    
    <div class="satu"></div>
    <br>
    <div class="dua"></div>
    <br>
    <div class="tiga"></div>
    <br>
    <div class="empat"></div>
   
    
</body>
</html>
