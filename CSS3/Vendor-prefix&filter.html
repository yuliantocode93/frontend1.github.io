<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
        }

        /* 
        blur(px)
        brightness(angka | %)
        contrast(angka | %)
        saturate(angka | %)
        grayscale(angka | %)
        sepia(angka | %)
        hue-rotate(deg)
        invert(angka | %)
        opacity(angka | %)
        drop-shadow(sama seperti box-shadow)
        */
        h1 {
            /* Untuk semua Broswer */
            /* -webkit-filter: grayscale(100%); */
            filter: drop-shadow(5px 5px 5px black);
        }

        img {
            filter: drop-shadow(5px 5px 5px black);
        }
    </style>
</head>
<body>
    <h1>BOX SHADOW</h1>
    <img src="y.png" alt="">
</body>
</html>
