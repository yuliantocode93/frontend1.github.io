<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
    <style>

        body {
            background-color: salmon;
            text-align: center;
        }
        .nama {
            font-family: arial;
            font-size: 80px;
            color: white;
            
        }

        .nama span {
            display: inline-block;
            transition: .3s;
            cursor:pointer;
        }

        .nama span:hover {
            transform: scale(2) translate(-25px);
        }



    </style>
</head>
<body>

    <h1 class="nama">Julian Kim</h1>
