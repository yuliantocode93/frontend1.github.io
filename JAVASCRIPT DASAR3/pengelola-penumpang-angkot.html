<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let penumpang = ['sisi', undefined, 'saco'];

        let tambahPenumpang = function (namaPenumpang, penumpang) {
            // jika angkot kosong
            if (penumpang.length == 0) {
                // tambah penumpang diawal array
                penumpang.push(namaPenumpang);
                // kembalikan isi array & keluar dari function
                return penumpang;
            } else {
                // telusuri seluruh kursi dari awal
                for (let i = 0; i < penumpang.length; i++) {
                    // jika ada kursi kosong
                    if (penumpang[i] == undefined) {
                        // tambah penumpang di kursi tersebut
                        penumpang[i] = namaPenumpang;
                        // kembalikan isi array & keluar dari function
                        return penumpang;
                    }
                    // jika sudah ada nama yang sama
                    else if (penumpang[i] == namaPenumpang){
                        // tampilkan pesan kesalahannya
                        console.log(namaPenumpang + " sudah ada di dalam angkot!");
                        // kembalikan isi array & keluar dari function
                        return penumpang;
                    }
                    // jika seluruh kursi terisi
                    else if( i == penumpang.length -1 ) {
                        // tambah penumpang di akhir array
                        penumpang.push(namaPenumpang);
                        // kembalikan isi array & keluar dari function
                        return penumpang;
                    }
                }
            }
        }


        let hapusPenumpang = function (namaPenumpang,penumpang){
            // ketika angkotnya kosong
            if(penumpang.length == 0) {
                console.log("angkotnya masih kosong");
            } // ketika ada isinya
            else {
                // telusuri lagi dengan pengulangan
                for(let i = 0;i < penumpang.length; i++) {
                    // cek isi penumpang
                    if(penumpang[i] == namaPenumpang) {
                        // jika ada penumpang yang turun
                        penumpang[i] = undefined;
                    } // kalau tidak ada penumpangnya
                    else if (i == penumpang.length - 1) {
                        // tampilkan pesannya
                        console.log(`sekarang ${namaPenumpang} tidak ada didalam angkot!`)
                    }
                }
            }
            return penumpang;
        }
    </script>
</body>

</html>
