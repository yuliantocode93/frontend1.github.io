let item = prompt('masukan nama makanan / minuman : \n (cth: nasi, daging, susu, hamburger, softdrink)');


switch( item) {
    case 'nasi' :
    case 'susu' :
    case 'daging' :
        document.writeln('<h2> makanan / minuman sehat </h2>');
        break;
    case 'hamburger' :
    case 'softdrink' :
        document.writeln('makanan / minuman tidak sehat');
        break;
    default:
        document.writeln('makanan / minuman yang salah');
        break;
