<body>
    <h1>Pengkondisian : ELSE IF</h1>
  <h2>Bilangan genap dan bilangan ganjil</h2>



    <script>

  let angka = prompt('masukan angka');
  if(angka % 2 === 0 ) {
    alert(angka + ' adalah bilangan genap');
  } else if ( angka % 2 === 1 ) {
        alert(angka + ' adalah bilangan ganjil');
  } else { 
    alert(' yang anda masukan bukan angka');
    
  }

    </script>
</body>
</html>
